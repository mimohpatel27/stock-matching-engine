services:
  mysql:
    image: mysql:8.4
    container_name: matching-engine-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: matching_engine
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    container_name: matching-engine-app
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      # Overrides application.properties at runtime — Spring Boot maps
      # SPRING_DATASOURCE_URL to spring.datasource.url automatically.
      # "mysql" here is the service name above, resolved via Docker's
      # internal network — not localhost, since these are separate containers.
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/matching_engine?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
    ports:
      - "8080:8080"

volumes:
  mysql_data:
