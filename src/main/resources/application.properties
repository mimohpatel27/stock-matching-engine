spring.application.name=stock-matching-engine

# ==========================================================
# ACTIVE: MySQL. Create the DB first if you haven't:
#   CREATE DATABASE matching_engine;
# Replace REPLACE_ME_WITH_YOUR_PASSWORD below with your local root password.
# ==========================================================
spring.datasource.url=jdbc:mysql://localhost:3306/matching_engine?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=Patel@1234
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

